name: Mobile CI

on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "mobile/**"
      - "supabase-personal/**"
      - "tools/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "supabase-personal/**"
      - "tools/**"
      - ".github/workflows/mobile-ci.yml"

# Reproducibility: the Flutter version is PINNED (verified stable tag at the
# time of pinning). Upgrades happen via explicit PR, never implicitly.
env:
  FLUTTER_VERSION: "3.47.2"

# Least privilege: read-only repo access; no workflow may write to the repo,
# packages, or deployments. Artifact upload does not require write scopes.
permissions:
  contents: read

jobs:
  flutter:
    name: Analyze, test, build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Print pinned Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Architecture boundary checks
        run: bash ../tools/check_boundaries.sh

      - name: Pub get
        run: flutter pub get

      - name: Lockfile status
        # The lockfile must be committed for reproducible builds. Until the
        # first successful CI run produces one, this uploads it as an
        # artifact for a maintainer to commit; once committed, this step
        # fails if pub get changed it (drift guard).
        run: |
          if git ls-files --error-unmatch pubspec.lock >/dev/null 2>&1; then
            git diff --exit-code pubspec.lock \
              || { echo "::error::pubspec.lock drifted from committed version"; exit 1; }
          else
            echo "::warning::pubspec.lock is not committed yet. Download the artifact from this run and commit it."
          fi

      - name: Upload pubspec.lock artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pubspec.lock
          path: mobile/pubspec.lock

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --reporter expanded

      - name: Build debug APK (no backend defines; not a release artifact)
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kuikchat-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  shell-lint:
    name: Shell lint (bash -n + ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: bash -n (syntax)
        run: |
          bash -n supabase-personal/tests/api_denial.sh
          bash -n tools/check_boundaries.sh
      - name: ShellCheck (security-sensitive scripts; merge-blocking)
        run: |
          shellcheck --version
          shellcheck supabase-personal/tests/api_denial.sh tools/check_boundaries.sh

  sql-validation:
    name: Validate Personal migrations (libpg_query)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Parse all Personal migrations with the PostgreSQL parser
        run: |
          npm install --no-save --no-audit --no-fund libpg-query@17.7.4
          node tools/validate-sql.mjs supabase-personal/migrations

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
